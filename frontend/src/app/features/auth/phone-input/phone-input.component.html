<div class="space-y-6">
  <div>
    <h2 class="text-xl font-semibold text-gray-900">Enter Phone Number</h2>
    <p class="text-sm text-gray-600 mt-1">We'll send you an OTP to verify</p>
  </div>

  <form [formGroup]="phoneForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">
        Phone Number
      </label>
      <input
        type="tel"
        formControlName="phone"
        placeholder="Enter 10-digit mobile number"
        maxlength="10"
        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent"
        [class.border-red-500]="phoneForm.get('phone')?.invalid && phoneForm.get('phone')?.touched"
      />
      @if (phoneForm.get('phone')?.invalid && phoneForm.get('phone')?.touched) {
        <p class="text-red-500 text-sm mt-1">
          Please enter a valid 10-digit mobile number starting with 6-9
        </p>
      }
    </div>

    @if (errorMessage()) {
      <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg">
        {{ errorMessage() }}
      </div>
    }

    <button
      type="submit"
      [disabled]="phoneForm.invalid || loading()"
      class="w-full bg-primary-600 text-white py-3 rounded-lg font-medium hover:bg-primary-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
    >
      @if (loading()) {
        <span>Sending OTP...</span>
      } @else {
        <span>Send OTP</span>
      }
    </button>

    <div class="text-center">
      <a 
        routerLink="/auth/officer-login"
        class="text-primary-600 hover:text-primary-700 text-sm font-medium"
      >
        Officer Login
      </a>
    </div>
  </form>
</div>
